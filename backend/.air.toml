# air (ホットリロードツール) の設定
# https://github.com/air-verse/air
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # ビルドコマンド: cmd/api/main.go をエントリポイントとして想定
  cmd = "go build -o ./tmp/main ./cmd/api"
  bin = "./tmp/main"
  full_bin = ""
  args_bin = []
  # 監視対象の拡張子
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "env"]
  # 監視除外ディレクトリ
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docker"]
  include_dir = []
  include_file = []
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = false
  follow_symlink = false
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  delay = 1000
  stop_on_error = false
  send_interrupt = false
  kill_delay = "0s"
  rerun = false
  rerun_delay = 500

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false
  main_only = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true
